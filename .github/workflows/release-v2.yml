name: Build and Release v2 (host + firmware-idf)

on:
  # Releases are cut by merging to main, and by nothing else. Pushing a
  # feature branch never triggers this workflow.
  #
  # Note it fires for any push to main, documentation included. Add a
  # paths-ignore filter here if doc-only merges should not spend a full
  # Windows + macOS + firmware build.
  push:
    branches: [main]
  # Manual escape hatch only — it never fires on its own. Running it against
  # a feature branch publishes a real release tagged from that branch, so
  # reach for it only when that is genuinely what you want.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - name: Vet and test (platform-independent packages)
        working-directory: host
        run: |
          go vet ./...
          go test ./... -count=1
      - name: Cross-compile Windows binary (compile check)
        working-directory: host
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build ./...
      # No GOOS=darwin cross-compile here: the macOS capture and GUI layers
      # are cgo and need the macOS SDK plus clang. The build-macos job is
      # what type-checks them.

  # Versioning lives in its own job so the Windows and macOS builds can run in
  # parallel instead of one waiting on the other just to learn the tag.
  meta:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Compute next tag
        id: meta
        run: |
          set -euo pipefail
          # A VERSION file is how a minor or major bump gets expressed. The
          # automatic path below only ever increments the patch, so without
          # this there is no way to release anything but vX.Y.(Z+1).
          #
          # When VERSION names a tag that does not exist yet, that is the
          # release. Once the tag exists the file goes inert and ordinary
          # merges resume bumping the patch from the latest tag, so it never
          # has to be reset — leave it naming the last deliberate bump.
          desired=""
          if [ -f VERSION ]; then
            desired="$(tr -d '[:space:]' < VERSION)"
          fi
          if [ -n "$desired" ] && ! [[ "$desired" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be X.Y.Z, got: $desired" >&2
            exit 1
          fi
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [ -n "$desired" ] && ! git rev-parse -q --verify "refs/tags/v$desired" >/dev/null; then
            next="v$desired"
          elif [ -z "$latest" ]; then
            next="v2.0.0"
          elif [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            if [ "$major" -lt 2 ]; then
              # v1.x tags belong to the legacy Arduino-era app.
              next="v2.0.0"
            else
              next="v${major}.${minor}.$((patch + 1))"
            fi
          else
            echo "Unexpected latest tag format: $latest" >&2
            exit 1
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "name=Release $next" >> "$GITHUB_OUTPUT"

  build-windows:
    runs-on: windows-latest
    needs: meta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - name: Build
        shell: pwsh
        working-directory: host
        run: ./build-production.ps1 -Output esp-hid-bridge.exe -Version ${{ needs.meta.outputs.tag }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: host/esp-hid-bridge.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    needs: meta
    # Best-effort for the first release cycle, like the firmware job. Once
    # this has published successfully, drop this and gate `release` on it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      # The ubuntu test job never compiles the darwin files, so this is the
      # only place the cgo capture and GUI code is type-checked at all.
      - name: Vet and test (darwin, cgo)
        working-directory: host
        run: |
          go vet ./...
          go test ./... -count=1
      # A stable signing identity is what lets macOS keep the Accessibility and
      # Input Monitoring grants across updates; ad-hoc signatures change every
      # build. The certificate is self-signed — no Apple Developer account —
      # so besides importing it, it has to be trusted for code signing on the
      # runner, or codesign refuses a root it does not know. With the secret
      # absent the build falls back to ad-hoc, and says so.
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          set -uo pipefail
          if [ -z "${CERT_P12_BASE64:-}" ]; then
            echo "::warning::No MACOS_SIGNING_CERT_P12 secret; the app will be ad-hoc signed and permission grants will not survive updates."
            exit 0
          fi
          # Everything below runs in a subshell under set -e. If any of it
          # fails the build still goes ahead ad-hoc signed — a release with a
          # renewable permission grant beats a release with no macOS build.
          if (
            set -e
            keychain="$RUNNER_TEMP/signing.keychain-db"
            keychain_password="$(uuidgen)"
            p12="$RUNNER_TEMP/signing.p12"
            echo "$CERT_P12_BASE64" | base64 --decode > "$p12"

            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security import "$p12" -k "$keychain" -P "$CERT_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$keychain_password" "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain" login.keychain-db

            # Trust the certificate itself as a code-signing root.
            pem="$RUNNER_TEMP/signing.pem"
            openssl pkcs12 -in "$p12" -clcerts -nokeys -passin "pass:$CERT_PASSWORD" -out "$pem" 2>/dev/null ||
              openssl pkcs12 -legacy -in "$p12" -clcerts -nokeys -passin "pass:$CERT_PASSWORD" -out "$pem"
            openssl x509 -in "$pem" -outform DER -out "$RUNNER_TEMP/signing.cer"
            sudo security add-trusted-cert -d -r trustRoot -p codeSign \
              -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.cer"

            identity="$(security find-identity -p codesigning "$keychain" |
              sed -n 's/.*"\(.*\)".*/\1/p' | head -n1)"
            [ -n "$identity" ]
            # Prove the identity actually signs before the real build relies on it.
            echo probe > "$RUNNER_TEMP/probe"
            codesign --force --sign "$identity" --timestamp=none "$RUNNER_TEMP/probe"
            rm -f "$p12" "$pem" "$RUNNER_TEMP/probe"
            printf '%s' "$identity" > "$RUNNER_TEMP/signing-identity"
          ); then
            identity="$(cat "$RUNNER_TEMP/signing-identity")"
            echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
            echo "Signing as \"$identity\""
          else
            echo "::warning::Importing the signing certificate failed; the app will be ad-hoc signed for this release and permission grants will not survive the update."
            rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing.pem"
          fi
      - name: Build universal .app
        working-directory: host
        run: ./build-macos.sh ${{ needs.meta.outputs.tag }}
      # The .dmg is the shipped artifact: it opens to a window with the app
      # and an Applications shortcut, so installing is a drag. The Finder
      # styling step inside is best-effort — on a headless runner the image
      # still works, it just looks plainer.
      - name: Build disk image
        working-directory: host
        run: ./build-dmg.sh ${{ needs.meta.outputs.tag }}
      # The .dmg is for people; the -macos.zip is what the app's own updater
      # downloads and swaps in.
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            host/dist/ESP-HID-Bridge-*.dmg
            host/dist/ESP-HID-Bridge-*-macos.zip
          if-no-files-found: error

  build-firmware:
    runs-on: ubuntu-latest
    # meta, not test: the firmware reports its version in HELLO, and that has
    # to be the tag the release job is about to create. Git cannot supply it —
    # the tag does not exist until after this build — so it comes from meta.
    # (meta itself needs test, so the gate is unchanged.)
    needs: meta
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # PROJECT_VER falls back to git describe, which needs the history.
          fetch-depth: 0
          fetch-tags: true
      - name: Build firmware (ESP-IDF, esp32c3)
        uses: espressif/esp-idf-ci-action@v1
        env:
          BRIDGE_FW_VERSION: ${{ needs.meta.outputs.tag }}
        with:
          esp_idf_version: v6.0
          target: esp32c3
          path: firmware-idf
          # Passed as a CMake cache entry as well as an env var: the action
          # builds inside a container, and this way the version arrives
          # whichever of the two the container forwards. If neither did,
          # main/CMakeLists.txt still falls back to git describe, so the
          # firmware would report the previous release rather than nothing.
          command: idf.py -D BRIDGE_FW_VERSION=${{ needs.meta.outputs.tag }} build
      - name: Package firmware images
        run: |
          mkdir -p firmware-out
          cp firmware-idf/build/esp_hid_bridge.bin firmware-out/
          cp firmware-idf/build/bootloader/bootloader.bin firmware-out/
          cp firmware-idf/build/partition_table/partition-table.bin firmware-out/
          cp firmware-idf/build/flash_args firmware-out/ 2>/dev/null || true
          cp firmware-idf/build/flasher_args.json firmware-out/ 2>/dev/null || true
          cd firmware-out && zip -r ../firmware-esp32c3.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32c3
          path: firmware-esp32c3.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [meta, build-windows, build-macos, build-firmware]
    # Release even if the macOS or firmware build failed — the exe is the
    # must-have.
    if: ${{ always() && needs.build-windows.result == 'success' }}
    steps:
      # Checkout comes first: it cleans the workspace, which would sweep up
      # artifacts downloaded before it.
      - uses: actions/checkout@v4
      # The release body is this version's CHANGELOG section. The app shows
      # it in its update prompt, so it is what the user reads before saying
      # yes; GitHub's generated notes follow it. No entry means generated
      # notes only, which is still a release.
      - name: Release notes from CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ ("^## \\[" v "\\]") { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "body_path=release-notes.md" >> "$GITHUB_OUTPUT"
            cat release-notes.md
          else
            echo "::warning::No CHANGELOG entry for $version; the release body will be the generated notes only."
          fi
        env:
          TAG: ${{ needs.meta.outputs.tag }}
      - name: Download artifacts
        # merge-multiple flattens every artifact into one directory, so the
        # filenames below must not collide.
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # One checksum per asset, in sha256sum's format. The updater verifies
      # its download against this before installing anything.
      - name: Checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/esp-hid-bridge.exe
            artifacts/ESP-HID-Bridge-*.dmg
            artifacts/ESP-HID-Bridge-*-macos.zip
            artifacts/firmware-esp32c3.zip
            artifacts/SHA256SUMS
